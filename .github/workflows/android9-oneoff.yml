name: Android 9 one-off

# One-off build for a single Android 9 (API 28) device. Not a release: no GitHub Release,
# no companion-latest.apk, no RuStore, no tags, no deploy. The APK is only a workflow artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - legacy-android9

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>&1 | tail -5

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.COMPANION_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
        run: |
          # Unlike release.yml, a random key is not acceptable here: the APK must carry the release cert.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::COMPANION_KEYSTORE_B64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/companion.jks"
          echo "COMPANION_KEYSTORE=$RUNNER_TEMP/companion.jks" >> "$GITHUB_ENV"
          echo "COMPANION_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK (minSdk 28)
        env:
          APPMETRICA_KEY: ${{ secrets.APPMETRICA_KEY }}
          MIN_SDK: '28'
          INSTALL_SOURCE: android9
        working-directory: android
        run: gradle assembleRelease --no-daemon --quiet

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "companion-android9-${VERSION}.apk"
          echo "name=companion-android9-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "companion-android9-${VERSION}.apk" | grep -E "^package|sdkVersion"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "companion-android9-${VERSION}.apk" | grep -i "SHA-256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7
