name: Companion Chat Test

on:
  push:
    branches: [chat-with-me]
    paths:
      - 'android/**'
      - '.github/workflows/chat-test.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        working-directory: android
        env:
          CHAT_TEST_API_URL: ${{ vars.CHAT_TEST_API_URL || 'http://127.0.0.1:18080/' }}
        run: ./gradlew :app:assembleChatTest --no-daemon -PchatTestApiUrl="$CHAT_TEST_API_URL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-chat-test
          path: android/app/build/outputs/apk/chatTest/app-chatTest.apk
          if-no-files-found: error
          retention-days: 14
