name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>&1 | tail -5

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.COMPANION_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::COMPANION_KEYSTORE_B64 is not set — APK signed with a random key; people will have to reinstall to update"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/companion.jks"
          echo "COMPANION_KEYSTORE=$RUNNER_TEMP/companion.jks" >> "$GITHUB_ENV"
          echo "COMPANION_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --quiet

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk companion-latest.apk
          cp android/app/build/outputs/apk/release/app-release.apk companion-${VERSION}.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            # Release already exists (created manually) — attach APKs and publish
            gh release upload "${VERSION}" \
              companion-latest.apk \
              companion-${VERSION}.apk \
              --clobber
            gh release edit "${VERSION}" --draft=false --latest
          elif [ -f ".github/release-notes/${VERSION}.md" ]; then
            # Notes written ahead of time in the repo
            gh release create "${VERSION}" \
              companion-latest.apk \
              companion-${VERSION}.apk \
              --title "Companion ${VERSION}" \
              --notes-file ".github/release-notes/${VERSION}.md" \
              --latest
          else
            gh release create "${VERSION}" \
              companion-latest.apk \
              companion-${VERSION}.apk \
              --title "Companion ${VERSION}" \
              --latest \
              --notes "$(cat <<'EOF'
          ## Что нового
          <!-- заполнить перед релизом -->

          ## Установка
          1. Скачай \`companion-${VERSION}.apk\`
          2. Разреши установку из неизвестных источников
          3. Установи файл

          ## Минимальная версия Android
          Android 10 (API 29)
          EOF
          )"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] && ICON="🚀" || ICON="❌"
          TAG="${{ github.ref_name }}"
          REL_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          MSG="${ICON} Release ${TAG} — ${STATUS} | ${REL_URL}"
          curl -sSf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}"
