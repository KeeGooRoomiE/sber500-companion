name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -o companion-server ./cmd/server
        working-directory: backend

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            backend/companion-server root@$HOST:/tmp/companion-server
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$HOST \
            "mv /tmp/companion-server /opt/companion/server && \
             chmod +x /opt/companion/server && \
             systemctl restart companion && \
             sleep 2 && systemctl is-active companion"
