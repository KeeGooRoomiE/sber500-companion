<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Метрики · companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #6B5CE7;
      --primary-light: #EDE9FF;
      --primary-mid:   #9B8AFF;
      --bg:            #F7F6FF;
      --white:         #FFFFFF;
      --text:          #18181B;
      --muted:         #71717A;
      --border:        #E4E4E7;
      --radius:        16px;
      --shadow:        0 2px 12px rgba(107,92,231,.08);
      --warn:          #F59E0B;
      --danger:        #EF4444;
      --ok:            #22C55E;
      --warn-bg:       #FFFBEB;
      --danger-bg:     #FEF2F2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 64px;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(247,246,255,.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 14px 24px;
      margin: 10px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 14px rgba(107,92,231,.07);
    }
    .nav-logo { font-weight: 700; font-size: 17px; color: var(--primary); letter-spacing: -0.3px; text-decoration: none; }
    .nav-badge { font-size: 11px; font-weight: 600; color: var(--primary); background: var(--primary-light); padding: 3px 9px; border-radius: 20px; }

    /* ── MAIN ── */
    main { max-width: 820px; margin: 36px auto 0; padding: 0 20px; }

    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -0.7px; margin-bottom: 10px; }
    .page-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .page-meta-text, #updated-at { font-size: 13px; color: var(--muted); }
    .btn-refresh {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--primary);
      background: var(--primary-light); border: none; border-radius: 20px;
      padding: 6px 14px; cursor: pointer; transition: opacity .15s;
    }
    .btn-refresh:hover { opacity: .8; }
    .btn-refresh svg { width: 13px; height: 13px; }

    /* ── SECTIONS ── */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    /* ── STAT GRID ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }

    .stat-tile {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px 14px;
      box-shadow: 0 1px 6px rgba(107,92,231,.06);
      display: flex; flex-direction: column; gap: 3px;
    }
    .stat-tile.warn   { background: var(--warn-bg);   border-color: #FDE68A; }
    .stat-tile.danger { background: var(--danger-bg); border-color: #FECACA; }

    .stat-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-value { font-size: 30px; font-weight: 800; letter-spacing: -1px; color: var(--text); line-height: 1; margin: 5px 0 2px; }
    .stat-tile.warn   .stat-value { color: var(--warn); }
    .stat-tile.danger .stat-value { color: var(--danger); }
    .stat-unit { font-size: 11px; color: var(--muted); font-weight: 500; }

    /* ── BUDGET BAR ── */
    .budget-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 20px 18px;
      box-shadow: 0 1px 6px rgba(107,92,231,.06);
      margin-top: 10px;
    }
    .budget-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .budget-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .budget-values { font-size: 13px; font-weight: 600; color: var(--text); }
    .budget-sub { font-size: 11px; color: var(--muted); }
    .budget-track {
      height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .budget-fill {
      height: 100%; border-radius: 99px;
      transition: width .4s ease;
      background: linear-gradient(90deg, var(--primary), var(--primary-mid));
    }
    .budget-fill.warn   { background: linear-gradient(90deg, var(--warn), #FCD34D); }
    .budget-fill.danger { background: linear-gradient(90deg, var(--danger), #F97316); }

    /* ── DAU CHART ── */
    .chart-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 20px 16px;
      box-shadow: 0 1px 6px rgba(107,92,231,.06);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .chart-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-peak { font-size: 12px; color: var(--muted); }
    #dau-chart { width: 100%; height: 80px; display: block; }

    /* ── ERROR ── */
    .error-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 48px 24px; text-align: center;
      box-shadow: 0 1px 6px rgba(107,92,231,.06);
    }
    .error-card .error-icon { font-size: 36px; margin-bottom: 14px; }
    .error-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .error-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">companion</a>
  <span class="nav-badge">Dev Metrics</span>
</nav>

<main>
  <div class="page-header">
    <h1>Метрики проекта</h1>
    <div class="page-meta">
      <span class="page-meta-text">Авторефреш каждые 30 сек</span>
      <span id="updated-at"></span>
      <button class="btn-refresh" onclick="fetchMetrics()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Обновить
      </button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script>
  // ── URL бэкенда — менять здесь когда появится домен ─────────────────────
  const API_URL = 'https://api.companion.keegooroomie.ru/api/v1/metrics';
  const LLM_BUDGET_RUB = 50000; // бюджет cloud.ru Foundation Models

  // ── Мок-данные (используются при ?demo=1 или когда бэкенд недоступен) ────
  // Данные синхронизированы с metrics-mock.html (22-дневная симуляция, старт 2 сент 2026)
  const MOCK_DATA = {
    // Рост
    users_total:              281,
    new_users_today:            9,
    dau_today:                 53,
    dau_7d_avg:                54,
    retention_d7_pct:          55.0,
    // Вовлечённость
    checkin_rate_pct:          68.0,
    morning_delivered_today:   53,
    calls_per_dau:             13.0,  // passive data + checkins + morning = ~13, KPI ≥10 ✓
    // LLM и инфра
    llm_calls_total:          1105,   // сумма DAU за 22 дня (1 LLM-вызов/юзер/день)
    llm_cost_rub_per_dau:      0.065, // GigaChat-3-Pro: ~0.065₽ на утренний прогноз
    llm_cost_rub_total:          71.8,
    p50_latency_ms:            310,
    p95_latency_ms:            820,
    error_rate_pct:              0.3,
    uptime_24h_pct:             99.8,
    // Последние 7 дней из 22-дневного ряда (17–23 сент)
    dau_history: [
      { date: '2026-09-17', dau: 54 },
      { date: '2026-09-18', dau: 53 },
      { date: '2026-09-19', dau: 55 },
      { date: '2026-09-20', dau: 56 },
      { date: '2026-09-21', dau: 52 },
      { date: '2026-09-22', dau: 54 },
      { date: '2026-09-23', dau: 53 },
    ],
    updated_at: new Date().toISOString(),
  };
  const IS_DEMO = new URLSearchParams(location.search).has('demo');

  // ── Секции с тайлами ──────────────────────────────────────────────────────
  const SECTIONS = [
    {
      title: 'Рост',
      tiles: [
        { key: 'users_total',       label: 'Всего юзеров',    unit: 'зарегистрировано' },
        { key: 'new_users_today',   label: 'Новых сегодня',   unit: 'человек' },
        { key: 'dau_today',         label: 'DAU сегодня',     unit: 'активных' },
        { key: 'dau_7d_avg',        label: 'DAU 7д avg',      unit: 'активных' },
        { key: 'retention_d7_pct',  label: 'Retention D7',    unit: '% вернулись', decimals: 1 },
      ]
    },
    {
      title: 'Вовлечённость',
      tiles: [
        { key: 'checkin_rate_pct',        label: 'Чек-ин rate',        unit: '% DAU сделали чек-ин',   decimals: 1 },
        { key: 'morning_delivered_today', label: 'Утренних сообщений', unit: 'доставлено сегодня' },
        { key: 'calls_per_dau',           label: 'Calls / DAU',        unit: 'запросов на юзера',      decimals: 1 },
      ]
    },
    {
      title: 'LLM и инфраструктура',
      tiles: [
        { key: 'llm_calls_total',      label: 'LLM calls total', unit: 'вызовов' },
        { key: 'llm_cost_rub_per_dau', label: 'Cost / DAU',      unit: '₽ на активного',   decimals: 2 },
        { key: 'p50_latency_ms',       label: 'P50 latency',     unit: 'мс' },
        { key: 'p95_latency_ms',       label: 'P95 latency',     unit: 'мс', warnAbove: 1500, dangerAbove: 3000 },
        { key: 'error_rate_pct',       label: 'Error rate',      unit: '%',  decimals: 2, warnAbove: 1, dangerAbove: 3 },
        { key: 'uptime_24h_pct',       label: 'Uptime 24ч',      unit: '%',  decimals: 1 },
      ]
    }
  ];

  // ─────────────────────────────────────────────────────────────────────────
  function tileClass(tile, value) {
    if (value == null) return '';
    if (tile.dangerAbove !== undefined && value >= tile.dangerAbove) return 'danger';
    if (tile.warnAbove   !== undefined && value >= tile.warnAbove)   return 'warn';
    return '';
  }

  function fmt(value, decimals) {
    if (value == null) return '—';
    return decimals > 0 ? (+value).toFixed(decimals) : Math.round(+value).toLocaleString('ru');
  }

  function renderSection(s, data) {
    const tiles = s.tiles.map(t => {
      const val = data[t.key];
      const cls = tileClass(t, val);
      return `<div class="stat-tile${cls ? ' ' + cls : ''}">
        <span class="stat-label">${t.label}</span>
        <span class="stat-value">${fmt(val, t.decimals)}</span>
        <span class="stat-unit">${t.unit}</span>
      </div>`;
    }).join('');
    return `<div class="section">
      <div class="section-title">${s.title}</div>
      <div class="stat-grid">${tiles}</div>
    </div>`;
  }

  function renderBudget(data) {
    const total = data.llm_cost_rub_total;
    if (total == null) return '';
    const pct     = Math.min((total / LLM_BUDGET_RUB) * 100, 100);
    const cls     = pct >= 80 ? 'danger' : pct >= 50 ? 'warn' : '';
    const spent   = total.toLocaleString('ru', { maximumFractionDigits: 0 });
    const budget  = LLM_BUDGET_RUB.toLocaleString('ru');
    return `<div class="budget-card">
      <div class="budget-header">
        <span class="budget-label">LLM бюджет (cloud.ru)</span>
        <span class="budget-values">${spent} ₽ <span class="budget-sub">из ${budget} ₽</span></span>
      </div>
      <div class="budget-track">
        <div class="budget-fill ${cls}" style="width:${pct.toFixed(1)}%"></div>
      </div>
    </div>`;
  }

  function renderChart(history) {
    const W = 760, H = 80, gap = 4;
    const n = history.length;
    const bw = Math.floor((W - gap * (n - 1)) / n);
    const maxV = Math.max(...history.map(d => d.dau), 1);
    const peak = Math.max(...history.map(d => d.dau));

    const bars = history.map((d, i) => {
      const x = i * (bw + gap);
      const h = Math.max(4, Math.round((d.dau / maxV) * H));
      const y = H - h;
      const op = (.4 + .6 * (d.dau / maxV)).toFixed(2);
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="#6B5CE7" opacity="${op}"/>`;
    }).join('');

    const labels = history.map((d, i) => {
      const x = i * (bw + gap) + bw / 2;
      const dt = new Date(d.date);
      const lbl = dt.toLocaleDateString('ru', { day: 'numeric', month: 'numeric' });
      return `<text x="${x}" y="${H + 14}" text-anchor="middle" font-size="9" fill="#71717A" font-family="Inter,sans-serif">${lbl}</text>`;
    }).join('');

    return `<div class="section"><div class="section-title">DAU за 7 дней</div>
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">Активные пользователи по дням</span>
          <span class="chart-peak">Пик: ${peak}</span>
        </div>
        <svg id="dau-chart" viewBox="0 0 ${W} ${H + 18}" preserveAspectRatio="none">${bars}${labels}</svg>
      </div>
    </div>`;
  }

  function renderMetrics(data) {
    let html = '';
    // Growth + Engagement sections
    html += renderSection(SECTIONS[0], data);
    html += renderSection(SECTIONS[1], data);
    // DAU chart before infra
    if (Array.isArray(data.dau_history) && data.dau_history.length > 0) {
      html += renderChart(data.dau_history);
    }
    // LLM section + budget bar
    html += renderSection(SECTIONS[2], data);
    html += renderBudget(data);

    document.getElementById('content').innerHTML = html;

    const ts = data.updated_at ? new Date(data.updated_at) : new Date();
    const tsText = 'Данные на ' + ts.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('updated-at').textContent =
      data._isMock ? '⚠ Демо-данные · бэкенд недоступен' : tsText;
  }

  function renderError() {
    document.getElementById('content').innerHTML = `
      <div class="error-card">
        <div class="error-icon">🚧</div>
        <h2>Бэкенд ещё не задеплоен</h2>
        <p>Данные появятся как только сервер будет доступен.<br>
        Страница переобновляется автоматически каждые 30 секунд.</p>
      </div>`;
    document.getElementById('updated-at').textContent = '';
  }

  async function fetchMetrics() {
    if (IS_DEMO) { renderMetrics(MOCK_DATA); return; }
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderMetrics(await res.json());
    } catch {
      // бэкенд недоступен — показываем мок с плашкой
      renderMetrics({ ...MOCK_DATA, _isMock: true });
    }
  }

  fetchMetrics();
  setInterval(fetchMetrics, 30000);
</script>
</body>
</html>
